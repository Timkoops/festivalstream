# Standaard blokkeerregel (Default Deny)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: streaming
spec:
  podSelector: {}
  policyTypes:
  - Ingress # Blokkeer standaard al het inkomende verkeer
  - Egress  # Blokkeer standaard al het uitgaande verkeer
---
# Toestaan van inkomend verkeer (Ingress)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: streaming
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    # Sta verkeer toe vanaf de NGINX Ingress controller 
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  - from:
    # Sta verkeer toe vanuit de monitoring namespace (bijv. voor Prometheus metrics)
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
---
# Toestaan van uitgaand verkeer (Egress)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress
  namespace: streaming
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    # Sta verkeer toe naar de storage namespace
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: storage-streaming
  - to:
    # Sta verkeer toe naar kube-system voor DNS-resolutie
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    # Specifieke poorten voor DNS (poort 53 UDP en TCP)
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP