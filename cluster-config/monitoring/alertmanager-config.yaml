    global:
      smtp_smarthost: 'sandbox.smtp.mailtrap.io:587'
      smtp_from: 'alerts@festivalstream.local'
      smtp_auth_username: 'c016545261d6fe'
      smtp_auth_password: '79007a3b164a5c' 

