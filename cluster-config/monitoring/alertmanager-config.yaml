# Dit is het configuratiebestand voor alertmanager, hier wordt beschreven hoe alertmanager werkt en welke ontvangers er zijn voor de meldingen.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      # De instellingen van mailtrap die worden gebruikt om de meldingen te versturen naar de opgegeven email adressen. 
      smtp_from: 'alerts@festivalstream.local'
      smtp_auth_username: '7b2a2f813459f4'
      smtp_auth_password: '4a42b04687dfbf'

    # De tijd instellingen voor de email hoelang en wanneer de email mag worden verstuurd. 
    route:
      receiver: email
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 24h
    
    # Dit zijn de ontvangers van de meldingen, in dit geval is het een email ontvanger. Hier worden de email adressen opgegeven waar de meldingen naartoe gestuurd moeten worden.      
    receivers:
      - name: email
        email_configs:
          - to: 's1213277@student.windesheim.nl,s1195560@student.windesheim.nl,s1210207@student.windesheim.nl,s1212086@student.windesheim.nl,s1202501@student.windesheim.nl'