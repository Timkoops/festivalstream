# Deze ConfigMap bevat de configuratie voor Prometheus, inclusief de scrape-configs en de alerting rules. 
# Hier wordt beschreven welke metrics Prometheus moet verzamelen en welke alerts er moeten worden gemaakt op basis van die metrics.

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          - 'alertmanager:9093'

    rule_files:
    - /etc/prometheus/alerts.yml

    scrape_configs:
    - job_name: 'prometheus'
      static_configs:
      - targets:
        - 'prometheus:9090'

    # De volgende scrape-config is gebaseerd op de metrics die worden verzameld door node-exporter. Deze scrape-config zorgt ervoor dat Prometheus de metrics van node-exporter verzamelt, zoals bijvoorbeeld het RAM-gebruik, opslaggebruik, CPU-gebruik en of een server offline is.
    - job_name: 'servers'
      kubernetes_sd_configs:
      - role: node
      relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - source_labels: [__meta_kubernetes_node_address_InternalIP]
        regex: (.+)
        target_label: __address__
        replacement: ${1}:9100
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node

    - job_name: 'kube-state-metrics'
      static_configs:
      - targets:
        - 'kube-state-metrics:8080'
    
    # De volgende scrape-config is gebaseerd op de metrics die worden verzameld door kube-state-metrics. Deze scrape-config zorgt ervoor dat Prometheus de metrics van kube-state-metrics verzamelt, zoals bijvoorbeeld of een pod in een crashloop zit.
    - job_name: 'kubernetes-pods'
      kubernetes_sd_configs:
      - role: pod
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod

    # De volgende scrape-config is gebaseerd op de metrics die worden verzameld door services. Deze scrape-config zorgt ervoor dat Prometheus de metrics van services verzamelt, zoals bijvoorbeeld of een service offline is.
    - job_name: 'kubernetes-services'
      kubernetes_sd_configs:
      - role: service
      relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__

    # De volgende scrape-config is gebaseerd op de metrics die worden verzameld door cAdvisor. Deze scrape-config zorgt ervoor dat Prometheus de metrics van cAdvisor verzamelt, zoals bijvoorbeeld het RAM-gebruik, opslaggebruik, CPU-gebruik en of een server offline is.
    - job_name: 'kubernetes-cadvisor'
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      kubernetes_sd_configs:
      - role: node
      relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
  
  # Hier worden de alerts beschreven die Prometheus moet monitoren. Deze alerts zorgen ervoor dat er een melding wordt gemaakt als er een alert is.
  alerts.yml: |
    groups:
    - name: system-alerts
      rules:

      #- alert: TestEmailAlert
      #  expr: vector(1)
      #  for: 1m
      #  labels:
      #    severity: info
      #  annotations:
      #    summary: "Test alert"
      #    description: "Dit is een test alert, deze zal altijd afgaan en zorgt ervoor dat er een melding wordt gemaakt als er een alert is."

      # De volgende alerts zijn gebaseerd op de metrics die worden verzameld door node-exporter en kube-state-metrics. Deze alerts zorgen ervoor dat er een melding wordt gemaakt als er een alert is, zoals bijvoorbeeld als het RAM-gebruik boven de 50% komt.
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 50
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "RAM gebruik boven 50%"
          description: "LET OP: Het RAM-geheugen is langer dan 2 minuten boven 50%. Controleer wat ervoor zorgt dat het RAM-geheugen zo hoog is."

      # De volgende alert is gebaseerd op de metrics die worden verzameld door node-exporter. Deze alert zorgt ervoor dat er een melding wordt gemaakt als er een alert is, zoals bijvoorbeeld als het opslaggebruik boven de 40% komt.
      - alert: HighDiskUsage
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 40
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Opslaggebruik boven 40%"
          description: "LET OP: De opslag is langer dan 2 minuten boven 40%. Als dit hoger wordt heeft het systeem minder opslagruimte."

      # De volgende alert is gebaseerd op de metrics die worden verzameld door node-exporter. Deze alert zorgt ervoor dat er een melding wordt gemaakt als er een alert is, zoals bijvoorbeeld als het een server offline is.
      - alert: NodeOffline
        expr: up{job="servers"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "De server is offline"
          description: "LET OP: Prometheus kan de server {{ $labels.instance }} al 3 minuten niet bereiken. Controleer of de server nog steeds online is en of er netwerkproblemen zijn."

      # De volgende alert is gebaseerd op de metrics die worden verzameld door node-exporter. Deze alert zorgt ervoor dat er een melding wordt gemaakt als er een alert is, zoals bijvoorbeeld als het CPU-gebruik boven de 85% komt.
      - alert: HighCpuUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU gebruik is hoog"
          description: "LET OP: CPU van {{ $labels.instance }} draait langer dan 5 minuten boven 85%. Controleer welke processen veel CPU gebruiken en of er een piek in het gebruik is."

      # De volgende alert is gebaseerd op de metrics die worden verzameld door kube-state-metrics. Deze alert zorgt ervoor dat er een melding wordt gemaakt als er een alert is, zoals bijvoorbeeld als een pod in een crashloop zit.
      - alert: PodCrashLooping
        expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod in CrashLoopBackOff"
          description: "LET OP: Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} zit in CrashLoopBackOff. Controleer de logs van de pod om te zien waarom deze crasht en probeer het probleem op te lossen."